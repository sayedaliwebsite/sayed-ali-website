<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sayed Ali Barber Shop</title>
<link rel="icon" href="assets/favicon_S.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --accent: #C9A227;
    --text: #12213A;
    --muted: #6B7280;
    --border: #E3E7EF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #FFFFFF 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    overflow-x: hidden;
  }
  html[lang="ar"] body { font-family: 'Almarai', 'IBM Plex Sans Arabic', sans-serif; }

  .wrap { max-width: 480px; width: 100%; text-align: center; }

  .lang-toggle {
    position: fixed;
    top: 24px;
    inset-inline-end: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
    box-shadow: 0 1px 3px rgba(18,33,58,0.06);
  }
  .lang-toggle:hover { color: var(--text); border-color: var(--accent); }

  .razor-wrap { width: 88px; height: 88px; margin: 0 auto 8px; }
  .razor-wrap svg { width: 100%; height: 100%; }
  .razor-line {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: draw 1.2s ease forwards 0.2s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .razor-line { stroke-dashoffset: 0; animation: none; }
  }

  .brand-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 0 6px;
  }
  html[lang="ar"] .brand-name { font-family: 'Almarai', sans-serif; letter-spacing: 1px; }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(34px, 8vw, 52px);
    font-weight: 700;
    line-height: 1.05;
    margin: 0 0 18px;
    color: var(--text);
  }
  html[lang="ar"] h1 { font-family: 'Almarai', sans-serif; font-weight: 800; }

  .sub {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 auto 34px;
    max-width: 380px;
  }

  .rule {
    width: 48px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 30px;
    border-radius: 2px;
  }

  .contact {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 22px;
    border-radius: 10px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 3px rgba(18,33,58,0.06);
  }
  .contact:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(18,33,58,0.08); }
  .contact svg { width: 16px; height: 16px; flex-shrink: 0; }

  .foot {
    margin-top: 46px;
    font-size: 11.5px;
    color: #9AA3B5;
  }
  .foot b { color: var(--muted); }
</style>
</head>
<body>
  <button class="lang-toggle" id="langBtn" onclick="toggleLang()">العربية</button>

  <div class="wrap">
    <div class="razor-wrap">
      <svg viewBox="0 0 24 24" fill="none">
        <path class="razor-line" d="M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0-6L20 4M6 9l14 11"
          stroke="#12213A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="brand-name" data-en="Sayed Ali · Barber Shop" data-ar="سيد علي · للحلاقة">Sayed Ali · Barber Shop</div>
    <h1 data-en="Coming soon." data-ar="قريبًا.">Coming soon.</h1>

    <div class="rule"></div>

    <a class="contact" href="tel:+201118884555" data-en-html='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Call the shop' data-ar-html='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> اتصل بالمحل'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span data-en="Call the shop" data-ar="اتصل بالمحل">Call the shop</span>
    </a>

    <div class="foot" data-en='Powered by <b>boostyourbuisness.net</b>' data-ar='بدعم من <b>boostyourbuisness.net</b>'>Powered by <b>boostyourbuisness.net</b></div>
  </div>

<script>
let lang = 'en';
function applyLang(){
  document.getElementById('htmlRoot').lang = lang;
  document.getElementById('htmlRoot').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'English' : 'العربية';
  document.querySelectorAll('[data-en]').forEach(el=>{
    el.textContent = lang==='ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
  });
  document.querySelectorAll('[data-en-html]').forEach(el=>{
    el.innerHTML = lang==='ar' ? el.getAttribute('data-ar-html') : el.getAttribute('data-en-html');
  });
  document.querySelectorAll('.foot').forEach(el=>{
    el.innerHTML = lang==='ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
  });
}
function toggleLang(){ lang = lang==='en' ? 'ar' : 'en'; applyLang(); }
applyLang();
</script>
</body>
</html>
